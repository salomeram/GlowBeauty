<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlowBeauty – protótipo hi-fi acessível</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--rosa:#E98A86;--rosaE:#B0443F;--claro:#F6C7C4;--tint:#FBEAE8;--preto:#292626;--cg:#666666;--cl:#E5E5E5;--verm:#A32824;--bg:#F4EEEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--preto);font:400 15px/1.5 Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:20px 12px}
h1,h2,.dm{font-family:"DM Sans",system-ui,sans-serif;line-height:1.2;margin:0}
button,input{font:inherit}
button{cursor:pointer}
.fr{width:360px;max-width:100%;height:760px;max-height:calc(100vh - 40px);background:#fff;border:3px solid var(--preto);border-radius:44px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sb{display:flex;justify-content:space-between;padding:14px 26px 4px;font:600 15px Inter}
.sb span:last-child{letter-spacing:2px;font-size:12px}
.bd{flex:1;overflow:auto;padding:6px 20px 16px}
.hd{display:flex;justify-content:space-between;align-items:center}
h1{font-size:32px;font-weight:500;margin:10px 0 14px}
h1:focus{outline:none}
:focus-visible{outline:3px solid var(--preto);outline-offset:2px;box-shadow:0 0 0 2px #fff}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--preto);padding:0}
.ib.o{border:2px solid var(--cg)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search{display:flex;align-items:center;gap:10px;background:var(--tint);border-radius:12px;min-height:48px;padding:0 14px;margin-bottom:14px}
.search .ib{margin-left:-10px;color:var(--rosaE)}
.search input{border:0;background:none;flex:1;color:var(--preto);min-height:44px;outline:none}
.search:focus-within{outline:3px solid var(--preto);outline-offset:2px}
::placeholder{color:var(--cg);opacity:1}
h2{font-size:18px;font-weight:700;margin:16px 0 10px}
.cards{display:flex;gap:12px;overflow-x:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}
.cd{flex:none;width:200px;height:140px;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;font:700 17px/1.25 "DM Sans";border:0;text-align:left}
.cd.a{background:var(--rosaE);color:#fff}.cd.b{background:var(--claro);color:var(--preto)}
.go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.cd.b .go{background:var(--preto);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{min-height:84px;border:2px solid var(--claro);background:var(--tint);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--preto);padding:6px 4px}
.cat .ic{width:28px;height:28px}
.cat[aria-pressed=true]{background:var(--rosaE);border-color:var(--rosaE);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{min-height:48px;border-radius:24px;border:2px solid var(--rosaE);padding:0 18px;background:var(--rosaE);color:#fff;font-weight:600}
.pill.l{background:var(--tint);color:var(--preto);border-color:var(--claro)}
.more{display:inline-flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;color:var(--rosaE);font-weight:600;text-decoration:underline;padding:0}
.tabs{display:flex;border-top:1px solid #d6d0ce;height:72px;background:#fff}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--cg);position:relative;min-height:56px;background:none;border:0}
.tb[aria-current=page]{color:var(--preto);font-weight:600}
.tb[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--preto)}
.bg{position:absolute;top:6px;left:calc(50% + 4px);min-width:20px;height:20px;border-radius:10px;background:var(--verm);color:#fff;font:700 11px "DM Sans";display:grid;place-items:center;padding:0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;list-style:none;padding:0;margin:0}
.prd{background:#fff;border:1px solid var(--cl);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.im{height:110px;position:relative;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
img.im{object-fit:cover;display:block}
.cd.ban{padding:0;width:300px;height:200px;overflow:hidden;background:var(--claro)}
.cd.ban img{width:100%;height:100%;object-fit:cover;display:block}
.im .ib{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.92)}
.pb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.pb b{font-size:14px}.pr{font:700 16px "DM Sans"}.stars{font-size:12px;color:#7a5c00}
.btn{min-height:48px;border-radius:14px;border:2px solid var(--rosaE);background:var(--rosaE);color:#fff;font-weight:600;width:100%}
.btn.s{background:#fff;color:var(--rosaE)}
.btn.m{min-height:44px;font-size:13px;margin-top:auto}
.btn:hover{filter:brightness(.93)}.btn:active{background:var(--claro);color:var(--preto);border-color:var(--rosaE)}
.btn[disabled]{background:#fff;color:#8a8a8a;border-color:var(--cl);cursor:not-allowed}
.note{border:2px solid var(--claro);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--cl)}
.row .im{width:60px;height:60px;border-radius:12px;flex:none;object-fit:cover}
.row .mid{flex:1;min-width:0}.row small{display:block;color:var(--cg)}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 0}
.empty .ic{width:96px;height:96px;color:var(--rosa);stroke-width:1.6}
.lbl{display:block;font:700 15px "DM Sans";margin-bottom:4px}.lbl i{color:var(--verm);font-style:normal}
.inp{width:100%;height:48px;border:2px solid var(--cg);border-radius:12px;padding:0 12px;color:var(--preto);background:#fff}
.inp[aria-invalid=true]{border-color:var(--verm)}
.hp{font-size:12.5px;color:var(--cg);margin:3px 0 10px}
.er{font-size:12.5px;color:var(--verm);font-weight:600;margin:3px 0 10px}
.er:empty{display:none}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:13px}
.chk input{width:24px;height:24px;accent-color:var(--rosaE);flex:none}
.chk a{color:var(--rosaE);font-weight:600}
.av{width:84px;height:84px;border-radius:50%;background:var(--claro);display:grid;place-items:center;font:500 30px "DM Sans";margin:0 auto}
.st{display:flex;justify-content:center;margin:10px 0 14px;text-align:center}
.st div{padding:0 16px;border-left:2px solid var(--cl)}.st div:first-child{border:0}
.st b{display:block;font:700 20px "DM Sans"}.st span{font-size:12.5px;color:var(--cg)}
.mn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;border:2px solid var(--cg);border-radius:14px;padding:0 14px;margin-bottom:10px;font-weight:500;background:#fff;color:var(--preto)}
.total{display:flex;justify-content:space-between;font:700 18px "DM Sans";margin:14px 0}
.two{display:flex;gap:10px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--preto);color:#fff;border-radius:14px;padding:14px 16px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:none}
.mod{position:absolute;inset:0;background:rgba(41,38,38,.55);display:grid;place-items:center;padding:20px}
.mod[hidden]{display:none}
.mod>div{background:#fff;border-radius:18px;padding:18px;width:100%}
.mod .acts{display:flex;gap:10px;margin-top:14px}

.ib{position:relative}
.im .ib{z-index:2}
.ov{position:absolute;inset:0;background:none;border:0;padding:0;z-index:1;cursor:pointer}
.nmb{background:none;border:0;padding:0;font:700 14px Inter;color:var(--preto);text-align:left;min-height:24px;cursor:pointer}
.tabs[hidden]{display:none}
button{transition:transform .12s,background-color .2s,color .2s,border-color .2s}
button:not(:disabled):active{transform:scale(.96)}
.cat{transition:background-color .25s,color .25s,border-color .25s}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0}to{opacity:1}}
.bd.t-f{animation:inR .3s ease-out}.bd.t-b{animation:inL .3s ease-out}.bd.t-x{animation:inF .22s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.5);opacity:.9}to{transform:scale(1.7);opacity:0}}
.ib.pop svg{animation:pop .45s ease-out}
.ib.pop::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #A32824;pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
.btn.ok,.btn.s.ok{background:#2F6F45;border-color:#2F6F45;color:#fff}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.bg.bump{animation:bump .45s ease-out}
@keyframes out{from{max-height:90px;opacity:1}to{max-height:0;opacity:0;transform:translateX(34px);padding-top:0;padding-bottom:0;border-width:0}}
.row.out{overflow:hidden;animation:out .23s ease-in forwards}
.dimg{position:relative;height:250px;border-radius:18px;overflow:hidden;margin-top:2px;background:#fff;border:1px solid var(--cl)}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dimg .ib{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92)}
.fs{border:0;padding:0;margin:12px 0 0}.fs legend{font:700 16px "DM Sans";padding:0;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:2px solid var(--cg);border-radius:14px;padding:6px 12px;margin-bottom:10px;cursor:pointer;transition:background-color .2s,border-color .2s}
.opt:has(input:checked){border-color:var(--rosaE);background:var(--tint)}
.opt input{width:24px;height:24px;accent-color:#B0443F;flex:none}.opt small{display:block;color:var(--cg)}
.okw{display:grid;place-items:center;margin:24px 0 8px}
.okc{width:104px;height:104px;fill:none;stroke:#2F6F45;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
@keyframes d1{from{stroke-dashoffset:214}to{stroke-dashoffset:0}}@keyframes d2{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}@keyframes pls{50%{transform:scale(1.08)}}
.okc circle{stroke-dasharray:214;animation:d1 .6s ease-out both}.okc path{stroke-dasharray:60;animation:d2 .4s .5s ease-out both}
.okw{animation:pls .5s .9s ease-in-out}

.oc{border:2px solid var(--cl);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc{display:flex;align-items:center;gap:8px;width:100%;min-height:64px;background:#fff;border:0;padding:8px 12px;text-align:left;color:var(--preto)}
.acc>span:first-child{flex:1}.acc small{display:block;color:var(--cg)}
.acc .ic{transition:transform .2s}.acc[aria-expanded=true] .ic{transform:rotate(90deg)}
.stt{font:700 12px "DM Sans";padding:3px 8px;border-radius:8px;white-space:nowrap}
.stt.e{background:#E6F3EA;color:#2F6F45}.stt.c{background:#FFF3CC;color:#7a5c00}.stt.p{background:#E3EEF9;color:#284D7A}
.ap{padding:0 12px 12px;animation:inF .2s}.ap[hidden]{display:none}.ap ul{margin:0 0 10px;padding-left:20px}
.cd2{border:2px solid var(--cl);border-radius:16px;padding:12px;margin-bottom:10px}
.cd2 small{display:block;color:var(--cg)}
.bdg{display:inline-block;background:var(--tint);color:var(--rosaE);font:700 12px "DM Sans";padding:2px 8px;border-radius:8px;margin-left:6px;border:1px solid var(--claro)}
.swr{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;background:#fff;border:2px solid var(--cl);border-radius:14px;padding:8px 12px;margin-bottom:10px;text-align:left;color:var(--preto)}
.swr .tx{flex:1}.swr small{display:block;color:var(--cg)}
.trk{width:52px;height:32px;border-radius:16px;background:var(--cg);position:relative;flex:none;transition:background-color .2s}
.trk::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.swr[aria-checked=true] .trk{background:#2F6F45}.swr[aria-checked=true] .trk::after{transform:translateX(20px)}
.sst{font:700 12px "DM Sans";min-width:64px;text-align:right;color:var(--cg)}
.noanim,.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.sh{font-size:14px;color:var(--cg);margin:16px 0 8px;font-weight:700}
.mn small{display:block;color:var(--cg);font-weight:400}
.m{max-width:84%;padding:10px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;animation:inF .25s}
.m.a{background:var(--tint);border-bottom-left-radius:4px}.m.u{background:var(--rosaE);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.mod{z-index:10}.toast{z-index:8}
.lib{position:absolute;right:12px;bottom:84px;z-index:6;min-height:48px;border-radius:24px;border:2px solid #fff;background:var(--rosaE);color:#fff;font:700 14px "DM Sans";display:flex;align-items:center;gap:6px;padding:0 16px 0 12px;box-shadow:0 4px 14px rgba(41,38,38,.35)}
.lib[hidden],.lp[hidden]{display:none}
.lp{position:absolute;right:12px;bottom:142px;z-index:6;width:228px;max-width:calc(100% - 24px);background:#fff;border:2px solid var(--preto);border-radius:18px;padding:6px 10px 10px;box-shadow:0 8px 24px rgba(41,38,38,.3);animation:inF .2s}
.lph{display:flex;justify-content:space-between;align-items:center}.lph b{font:700 14px "DM Sans"}
.lpv{background:var(--tint);border-radius:12px;display:block;width:100%;height:auto}
.cap{background:var(--preto);color:#fff;border-radius:10px;padding:8px 10px 10px;min-height:56px;font-size:14px;margin-top:8px;position:relative;overflow:hidden}
.cap i{position:absolute;left:0;bottom:0;height:3px;background:var(--claro);width:0}
@keyframes bar{from{width:0}to{width:100%}}
.lpc{display:flex;gap:6px;margin-top:8px}
.lpc button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--rosaE);background:#fff;color:var(--rosaE);font:600 12px Inter;padding:0 2px}
.lpc button[aria-pressed=true]{background:var(--rosaE);color:#fff}
@keyframes aL{from{transform:rotate(8deg)}to{transform:rotate(-42deg)}}
@keyframes aR{from{transform:rotate(-6deg)}to{transform:rotate(36deg)}}
@keyframes nd{from{transform:translateY(0)}to{transform:translateY(2px)}}
.sg .armL{animation:aL .8s ease-in-out infinite alternate}.sg .armR{animation:aR 1s ease-in-out infinite alternate}.sg .head{animation:nd 1.2s ease-in-out infinite alternate}
.lp.slow .sg *{animation-duration:2s!important}
.sg.pz *{animation-play-state:paused!important}
.armL{transform-origin:62px 104px}.armR{transform-origin:118px 104px}
.lib{right:0;border-right:0;border-radius:24px 0 0 24px;transition:transform .35s ease}
.lib.tuck{transform:translateX(calc(100% - 42px))}
.lp{width:248px;right:8px}
.cap{min-height:72px}.cap .w{padding:0 2px;border-radius:4px}.cap .w.cur{background:#F6C7C4;color:#292626;font-weight:700}
.ag{transition:transform .38s ease-in-out}.lp.slow .ag{transition-duration:.65s}
.brw{transition:transform .2s}
@keyframes blk{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blk 4.6s infinite}
@keyframes brt{from{transform:translateY(0)}to{transform:translateY(1.6px)}}
.torso{animation:brt 3s ease-in-out infinite alternate}
@keyframes mth{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.sg .mo{animation:mth .3s steps(1) infinite}
.sg.pz *,.pz *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>

function trCore(c){const v=TD[LC].get(c);if(v!==undefined)return v;if(ALT.has(c)){const n=trCore(ALT.get(c));return LC=='es'?'Foto de '+n:'Photo of '+n}for(const [re,f] of RU){const m=c.match(re);if(m)return f(m,LC)}return c}
function trs(s){if(LC=='pt')return s;const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);return m[2]?m[1]+trCore(m[2])+m[3]:s}
const OT=new WeakMap(),OA=new WeakMap(),AT=['aria-label','placeholder','alt','title'];
function trTextNode(n){const v=n.nodeValue,r=OT.get(n),o=(r&&v===r.t)?r.o:v,t=trs(o);if(t!==v)n.nodeValue=t;OT.set(n,{o,t})}
function trEl(e){for(const a of AT){if(!e.hasAttribute(a))continue;const v=e.getAttribute(a);let m=OA.get(e);if(!m){m={};OA.set(e,m)}const r=m[a],o=(r&&v===r.t)?r.o:v,t=trs(o);if(t!==v)e.setAttribute(a,t);m[a]={o,t}}}
function trTree(root){if(root.nodeType==3){trTextNode(root);return}if(root.nodeType!=1)return;trEl(root);const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){n.nodeType==3?trTextNode(n):trEl(n)}}
const OBS=new MutationObserver(ms=>{for(const m of ms){if(m.type=='childList')m.addedNodes.forEach(trTree);else if(m.type=='characterData')trTextNode(m.target);else if(m.type=='attributes')trEl(m.target)}OBS.takeRecords()});
OBS.observe($('#fr'),{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:AT});
